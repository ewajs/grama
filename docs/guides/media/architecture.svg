<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Grama architecture</title>
  <desc id="desc">Layers of the app: UI on top, then the app layer, then the pure core, with content, storage and offline scripts alongside. Dependencies point down.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a87a0"/>
    </marker>
  </defs>
<rect x="30" y="20" width="860" height="110" rx="10" fill="#ecebfd" stroke="#5b5bd6" stroke-width="1.5"/>
<text x="44" y="44" font-weight="700" font-size="15" fill="#1d1b2e">UI · src/ui</text>
<text x="44" y="64" font-size="13" fill="#55526a">Svelte components: GameScreen, LetterWheel, Board, WordPill, Home, LevelMap, dialogs…</text>
<text x="44" y="82" font-size="13" fill="#55526a">ui/lib: wheel geometry, board layout, letter flights, haptics, confetti</text>
<text x="44" y="100" font-size="13" fill="#55526a">Render state and turn gestures into intents. No game rules here.</text>
<line x1="460" y1="130" x2="460" y2="175" stroke="#8a87a0" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="468.0" y="156.5" font-size="12" fill="#8a87a0" text-anchor="start">reads getters, calls methods</text>
<rect x="30" y="178" width="860" height="110" rx="10" fill="#e4f5ec" stroke="#2f9e6e" stroke-width="1.5"/>
<text x="44" y="202" font-weight="700" font-size="15" fill="#1d1b2e">App · src/app</text>
<text x="44" y="222" font-size="13" fill="#55526a">Game: the running game, reactive state over core (current level, replay or daily)</text>
<text x="44" y="240" font-size="13" fill="#55526a">Preferences, Navigation, Installer · start, report, share, updates, clock</text>
<text x="44" y="258" font-size="13" fill="#55526a">The only layer that knows both the UI and the rules.</text>
<line x1="300" y1="288" x2="300" y2="340" stroke="#8a87a0" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="308.0" y="318.0" font-size="12" fill="#8a87a0" text-anchor="start">pure functions</text>
<line x1="700" y1="288" x2="700" y2="340" stroke="#8a87a0" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="708" y="318" font-size="12" fill="#8a87a0" text-anchor="start">save / load</text>
<line x1="130" y1="288" x2="130" y2="340" stroke="#8a87a0" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="138" y="318" font-size="12" fill="#8a87a0" text-anchor="start">word list</text>
<rect x="30" y="343" width="200" height="120" rx="10" fill="#e6f0fb" stroke="#3b7bd0" stroke-width="1.5"/>
<text x="44" y="367" font-weight="700" font-size="15" fill="#1d1b2e">Content · src/content</text>
<text x="44" y="387" font-size="13" fill="#55526a">loadWords()</text>
<text x="44" y="405" font-size="13" fill="#55526a">buildWordList()</text>
<text x="44" y="423" font-size="13" fill="#55526a">es/*.txt word lists</text>
<rect x="250" y="343" width="420" height="120" rx="10" fill="#fdf2dc" stroke="#c98a0e" stroke-width="1.5"/>
<text x="264" y="367" font-weight="700" font-size="15" fill="#1d1b2e">Core · src/core  (pure, no DOM)</text>
<text x="264" y="387" font-size="13" fill="#55526a">level · generate · difficulty · cadence · daily</text>
<text x="264" y="405" font-size="13" fill="#55526a">session · progress · evaluate · hints · board</text>
<text x="264" y="423" font-size="13" fill="#55526a">history · stats · achievements · random · spanish</text>
<text x="264" y="441" font-size="13" fill="#55526a">Plain data in, new plain data out.</text>
<rect x="690" y="343" width="200" height="120" rx="10" fill="#e6f0fb" stroke="#3b7bd0" stroke-width="1.5"/>
<text x="704" y="367" font-weight="700" font-size="15" fill="#1d1b2e">Storage · src/storage</text>
<text x="704" y="387" font-size="13" fill="#55526a">saveGame / loadGame</text>
<text x="704" y="405" font-size="13" fill="#55526a">saveSettings / loadSettings</text>
<text x="704" y="423" font-size="13" fill="#55526a">localStorage</text>
<rect x="30" y="500" width="420" height="80" rx="10" fill="#f1f0f5" stroke="#8a87a0" stroke-width="1.5"/>
<text x="44" y="524" font-weight="700" font-size="15" fill="#1d1b2e">scripts/ (offline, never shipped)</text>
<text x="44" y="544" font-size="13" fill="#55526a">prepare-words: RLA-ES + wordfreq → es/*.txt</text>
<text x="44" y="562" font-size="13" fill="#55526a">icons: SVG → PNG</text>
<line x1="130" y1="500" x2="130" y2="466" stroke="#8a87a0" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="138" y="488" font-size="12" fill="#8a87a0" text-anchor="start">writes</text>
<rect x="470" y="500" width="420" height="80" rx="10" fill="#f1f0f5" stroke="#8a87a0" stroke-width="1.5"/>
<text x="484" y="524" font-weight="700" font-size="15" fill="#1d1b2e">i18n · src/i18n</text>
<text x="484" y="544" font-size="13" fill="#55526a">Every word the player reads (Rioplatense Spanish),</text>
<text x="484" y="562" font-size="13" fill="#55526a">used by the UI</text>
</svg>
