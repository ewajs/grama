<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">A word from the wheel to the save</title>
  <desc id="desc">Numbered steps: the wheel builds the word, the game screen submits it, Game hands it to core, core judges it and records it, Game applies the new state, which is saved and re-rendered.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a87a0"/>
    </marker>
  </defs>
<rect x="20" y="30" width="200" height="90" rx="10" fill="#ecebfd" stroke="#5b5bd6" stroke-width="1.5"/>
<text x="34" y="54" font-weight="700" font-size="15" fill="#1d1b2e">1 · LetterWheel</text>
<text x="34" y="74" font-size="13" fill="#55526a">pointer events, letterAt,</text>
<text x="34" y="92" font-size="13" fill="#55526a">extendPath; release →</text>
<text x="34" y="110" font-size="13" fill="#55526a">onsubmit(word)</text>
<rect x="250" y="30" width="200" height="90" rx="10" fill="#ecebfd" stroke="#5b5bd6" stroke-width="1.5"/>
<text x="264" y="54" font-weight="700" font-size="15" fill="#1d1b2e">2 · GameScreen</text>
<text x="264" y="74" font-size="13" fill="#55526a">submit(word) →</text>
<text x="264" y="92" font-size="13" fill="#55526a">game.submit(word)</text>
<rect x="480" y="30" width="200" height="90" rx="10" fill="#e4f5ec" stroke="#2f9e6e" stroke-width="1.5"/>
<text x="494" y="54" font-weight="700" font-size="15" fill="#1d1b2e">3 · Game.submit</text>
<text x="494" y="74" font-size="13" fill="#55526a">what&#x27;s on screen: a place</text>
<text x="494" y="92" font-size="13" fill="#55526a">(level or daily) + session</text>
<rect x="710" y="30" width="190" height="90" rx="10" fill="#fdf2dc" stroke="#c98a0e" stroke-width="1.5"/>
<text x="724" y="54" font-weight="700" font-size="15" fill="#1d1b2e">4 · playWord</text>
<text x="724" y="74" font-size="13" fill="#55526a">evaluate: target, bonus,</text>
<text x="724" y="92" font-size="13" fill="#55526a">repeated or invalid;</text>
<text x="724" y="110" font-size="13" fill="#55526a">points (× tier)</text>
<line x1="220" y1="75" x2="247" y2="75" stroke="#8a87a0" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="450" y1="75" x2="477" y2="75" stroke="#8a87a0" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="680" y1="75" x2="707" y2="75" stroke="#8a87a0" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="710" y="170" width="190" height="112" rx="10" fill="#fdf2dc" stroke="#c98a0e" stroke-width="1.5"/>
<text x="724" y="194" font-weight="700" font-size="15" fill="#1d1b2e">5 · new data</text>
<text x="724" y="214" font-size="13" fill="#55526a">session + word found;</text>
<text x="724" y="232" font-size="13" fill="#55526a">progress: score, hints;</text>
<text x="724" y="250" font-size="13" fill="#55526a">complete? → history</text>
<text x="724" y="268" font-size="13" fill="#55526a">or dailies</text>
<line x1="805" y1="120" x2="805" y2="167" stroke="#8a87a0" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="480" y="170" width="200" height="112" rx="10" fill="#e4f5ec" stroke="#2f9e6e" stroke-width="1.5"/>
<text x="494" y="194" font-weight="700" font-size="15" fill="#1d1b2e">6 · Game.#apply</text>
<text x="494" y="214" font-size="13" fill="#55526a">replaces $state:</text>
<text x="494" y="232" font-size="13" fill="#55526a">session to its place,</text>
<text x="494" y="250" font-size="13" fill="#55526a">getters change</text>
<line x1="710" y1="220" x2="683" y2="220" stroke="#8a87a0" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="250" y="170" width="200" height="112" rx="10" fill="#e6f0fb" stroke="#3b7bd0" stroke-width="1.5"/>
<text x="264" y="194" font-weight="700" font-size="15" fill="#1d1b2e">7 · saveGame</text>
<text x="264" y="214" font-size="13" fill="#55526a">onchange(progress) →</text>
<text x="264" y="232" font-size="13" fill="#55526a">localStorage</text>
<line x1="480" y1="220" x2="453" y2="220" stroke="#8a87a0" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="250" y="320" width="650" height="80" rx="10" fill="#ecebfd" stroke="#5b5bd6" stroke-width="1.5"/>
<text x="264" y="344" font-weight="700" font-size="15" fill="#1d1b2e">8 · Svelte re-renders what read those getters</text>
<text x="264" y="364" font-size="13" fill="#55526a">Board: letters fly in (fly.ts) · WordPill: feedback in place · Header: score tweens</text>
<text x="264" y="382" font-size="13" fill="#55526a">BonusCounter, HintButton, AchievementToast, LevelComplete when the level is done</text>
<line x1="580" y1="282" x2="580" y2="317" stroke="#8a87a0" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30" y="320" width="14" height="14" rx="3" fill="#ecebfd" stroke="#5b5bd6"/>
<text x="52" y="332" font-size="13" font-weight="400" fill="#8a87a0" text-anchor="start">UI</text>
<rect x="30" y="342" width="14" height="14" rx="3" fill="#e4f5ec" stroke="#2f9e6e"/>
<text x="52" y="354" font-size="13" font-weight="400" fill="#8a87a0" text-anchor="start">App</text>
<rect x="30" y="364" width="14" height="14" rx="3" fill="#fdf2dc" stroke="#c98a0e"/>
<text x="52" y="376" font-size="13" font-weight="400" fill="#8a87a0" text-anchor="start">Core</text>
<rect x="30" y="386" width="14" height="14" rx="3" fill="#e6f0fb" stroke="#3b7bd0"/>
<text x="52" y="398" font-size="13" font-weight="400" fill="#8a87a0" text-anchor="start">Storage</text>
</svg>
